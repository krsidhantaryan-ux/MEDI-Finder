<!DOCTYPE html>
<html>
<head>
    <title>Register - MedFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); min-height: 100vh; padding: 40px 0; }
        .auth-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-custom { border-radius: 10px; font-weight: 500; padding: 12px; transition: all 0.3s; }
        .btn-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3); }
        .form-control { border-radius: 10px; padding: 10px 12px; background-color: #f8f9fa; border: 1px solid #eee; }
        .form-control:focus { box-shadow: none; border-color: #0d6efd; background-color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-building-add text-primary" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">Create Account</h3>
                        <p class="text-muted small">Register your pharmacy and upload verification details</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger text-center small border-0 rounded-3 mb-3">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/register" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Shop Name *</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Apollo Pharmacy" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Create Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <hr class="my-4 text-muted">
                        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-shield-check"></i> Shop Verification Documents</h6>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Drug License Number *</label>
                            <input type="text" name="license_number" class="form-control" placeholder="e.g. DL-12345678" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Drug License Copy (Image/PDF) *</label>
                            <input type="file" name="license_image" class="form-control" accept="image/*,.pdf" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">GST Certificate <span class="fw-normal text-muted">(Optional)</span></label>
                            <input type="file" name="gst_certificate" class="form-control" accept="image/*,.pdf">
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Shop Photo *</label>
                            <input type="file" name="shop_photo" class="form-control" accept="image/*" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-custom w-100">Register & Submit for Approval <i class="bi bi-arrow-right"></i></button>
                    </form>
                    <div class="mt-4 text-center">
                        <p class="mb-1 text-muted small">Already registered?</p>
                        <a href="/login" class="text-primary text-decoration-none fw-bold">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
