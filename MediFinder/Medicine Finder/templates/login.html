<!DOCTYPE html>
<html>
<head>
    <title>Shop Login - MedFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.1); backdrop-filter: blur(10px); animation: slideUp 0.6s ease-out; }
        .btn-custom { border-radius: 10px; font-weight: 500; padding: 12px; transition: all 0.3s; }
        .btn-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3); }
        .form-control { border-radius: 10px; padding: 12px; background-color: #f8f9fa; border: 1px solid #eee; }
        .form-control:focus { box-shadow: none; border-color: #198754; background-color: #fff; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shop text-success" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">Welcome Back</h3>
                        <p class="text-muted small">Login to manage your pharmacy</p>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger text-center small border-0 rounded-3"><i class="bi bi-exclamation-octagon"></i> {{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Shop Name (Username)</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter your shop name" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-custom w-100">Login to Dashboard <i class="bi bi-box-arrow-in-right"></i></button>
                    </form>
                    <div class="mt-4 text-center">
                        <p class="mb-1 text-muted small">New pharmacy?</p>
                        <a href="/register" class="text-success text-decoration-none fw-bold">Register your shop here</a>
                        <hr class="my-3 text-muted">
                        <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to Map Search</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
