<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - MedFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a1e21; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #212529; color: white; border-radius: 20px; border: 1px solid #343a40; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { border-radius: 10px; padding: 12px; background-color: #2c3035; border: 1px solid #495057; color: white; }
        .form-control:focus { background-color: #2c3035; color: white; border-color: #0d6efd; box-shadow: none; }
        .back-link { color: #8ab4f8; transition: color 0.2s; }
        .back-link:hover { color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">Admin Portal</h3>
                        <p class="text-muted small">Log in to review shop verifications</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger text-center small border-0 rounded-3 mb-3">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/admin">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="admin" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius: 10px;">Login to Portal <i class="bi bi-box-arrow-in-right"></i></button>
                    </form>

                    <div class="mt-4 text-center">
                        <a href="/" class="text-decoration-none back-link small fw-medium">
                            <i class="bi bi-arrow-left me-1"></i> Back to Home Page
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
