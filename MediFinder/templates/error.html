{% extends "base.html" %}
{% block title %}{{ code }} — MediFinder{% endblock %}
{% block content %}
<section class="section">
<div class="container text-center" style="max-width:520px">
    <div style="font-family:var(--font-display);font-size:6rem;line-height:1;color:var(--teal-700);font-weight:600">{{ code }}</div>
    <h1>{{ message }}</h1>
    <p class="text-muted">The page you're looking for may have moved, or something went wrong on our end.</p>
    <div class="flex gap-2 center" style="justify-content:center;margin-top:1.5rem">
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Home</a>
        <a href="{{ url_for('search_page') }}" class="btn btn-outline"><i class="bi bi-search"></i> Find medicine</a>
    </div>
</div>
</section>
{% endblock %}
