<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Pharmacy - MedFinder</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20261123-12">
</head>
<body class="ambient-bg d-flex align-items-center justify-content-center py-5">

<div class="container d-flex justify-content-center position-relative" style="z-index: 2;">
    <div class="card glass-card register-card p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2 fw-bold text-primary">
                <span class="brand-mark-badge" style="width: 30px; height: 30px;" aria-hidden="true"><i class="bi bi-capsule-pill"></i></span>
                <span>MedFinder</span>
            </a>
            <button type="button" class="btn btn-sm glass-card px-2 py-1 rounded-circle" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle color theme">
                <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-dark" aria-hidden="true"></i>
            </button>
        </div>

        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-4 mb-3 shadow-sm" style="width: 58px; height: 58px;" aria-hidden="true">
                <i class="bi bi-clipboard-plus fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Register Your Pharmacy</h3>
            <p class="text-muted small mb-0">Submit your Drug License &amp; store details to publish live medicine inventory</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3 py-2 small shadow-sm" role="alert"><i class="bi bi-exclamation-triangle me-1" aria-hidden="true"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="reg-shop-name" class="form-label small fw-bold">Shop Name *</label>
                    <input type="text" id="reg-shop-name" name="name" class="form-control glass-input rounded-3" placeholder="e.g. City Medico" autocomplete="organization" required>
                </div>

                <div class="col-md-6">
                    <label for="reg-password" class="form-label small fw-bold">Account Password *</label>
                    <input type="password" id="reg-password" name="password" class="form-control glass-input rounded-3" placeholder="Create Password" autocomplete="new-password" required>
                </div>

                <div class="col-md-6">
                    <label for="reg-license" class="form-label small fw-bold">Drug License Number *</label>
                    <input type="text" id="reg-license" name="license_number" class="form-control glass-input rounded-3" placeholder="e.g. DL-12345678" required>
                </div>

                <div class="col-md-6">
                    <label for="reg-phone" class="form-label small fw-bold">Contact Phone (Optional)</label>
                    <input type="tel" id="reg-phone" name="phone" class="form-control glass-input rounded-3" placeholder="e.g. 9876543210" autocomplete="tel">
                </div>

                <div class="col-12">
                    <label for="reg-hours" class="form-label small fw-bold">Opening Hours (Optional)</label>
                    <input type="text" id="reg-hours" name="opening_hours" class="form-control glass-input rounded-3" placeholder="e.g. Mon-Sun, 8:00 AM - 10:00 PM">
                </div>

                <div class="col-md-6">
                    <label for="reg-license-img" class="form-label small fw-bold">License Image *</label>
                    <input type="file" id="reg-license-img" name="license_image" class="form-control glass-input rounded-3" accept="image/*" required>
                </div>

                <div class="col-md-6">
                    <label for="reg-shop-photo" class="form-label small fw-bold">Shop Front Photo *</label>
                    <input type="file" id="reg-shop-photo" name="shop_photo" class="form-control glass-input rounded-3" accept="image/*" required>
                </div>

                <div class="col-12">
                    <label for="reg-gst" class="form-label small fw-bold">GST Certificate (Optional)</label>
                    <input type="file" id="reg-gst" name="gst_certificate" class="form-control glass-input rounded-3" accept="image/*,.pdf">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mt-4">
                Submit Registration <i class="bi bi-check-circle ms-1" aria-hidden="true"></i>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <small class="text-muted">Already registered? <a href="/login" class="text-primary fw-semibold text-decoration-none">Sign In</a></small>
            <div class="mt-2"><a href="/" class="small text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to Medicine Search</a></div>
        </div>
    </div>
</div>

<script src="/static/js/main.js?v=20261123-12"></script>
</body>
</html>
