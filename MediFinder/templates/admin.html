<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - MedFinder</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css?v=20261123-13">
</head>
<body class="ambient-bg d-flex align-items-center justify-content-center py-5">

<div class="container d-flex justify-content-center position-relative" style="z-index: 2;">
    <div class="card glass-card auth-card p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2 fw-bold text-primary">
                <span class="brand-mark-badge" style="width: 30px; height: 30px;" aria-hidden="true"><i class="bi bi-capsule-pill"></i></span>
                <span>MedFinder</span>
            </a>
            <button type="button" class="btn btn-sm glass-card px-2 py-1 rounded-circle" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle color theme">
                <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-dark" aria-hidden="true"></i>
            </button>
        </div>

        <div class="text-center mb-4">
            <div class="bg-dark text-white d-inline-flex align-items-center justify-content-center rounded-4 mb-3 shadow-sm" style="width: 58px; height: 58px;" aria-hidden="true">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Admin Control</h3>
            <p class="text-muted small mb-0">Drug-license verification &amp; store compliance portal</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3 py-2 small shadow-sm" role="alert"><i class="bi bi-exclamation-triangle me-1" aria-hidden="true"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="admin-username" class="form-label small fw-bold">Admin Username</label>
                <input type="text" id="admin-username" name="username" class="form-control glass-input rounded-3" placeholder="Admin Username" autocomplete="username" required>
            </div>

            <div class="mb-4">
                <label for="admin-password" class="form-label small fw-bold">Admin Password</label>
                <input type="password" id="admin-password" name="password" class="form-control glass-input rounded-3" placeholder="Password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                Authenticate <i class="bi bi-shield-check ms-1" aria-hidden="true"></i>
            </button>
        </form>

        <div class="text-center mt-2 pt-3 border-top">
            <a href="/" class="small text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to Medicine Search</a>
        </div>
    </div>
</div>

<script src="/static/js/main.js?v=20261123-13"></script>
</body>
</html>
