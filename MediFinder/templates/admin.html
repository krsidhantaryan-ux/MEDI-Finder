<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal - MedFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="ambient-bg d-flex align-items-center justify-content-center py-5">

<div class="container d-flex justify-content-center position-relative" style="z-index: 2;">
    <div class="card glass-card auth-card p-4 p-md-5">
        <div class="d-flex justify-content-end mb-2">
            <button class="btn btn-sm glass-card px-2 py-1 rounded-circle" onclick="toggleTheme()" title="Toggle Theme">
                <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-dark"></i>
            </button>
        </div>
        <div class="text-center mb-4">
            <div class="bg-dark text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow" style="width: 60px; height: 60px;">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark">Admin Control</h3>
            <p class="text-muted small">Verification and oversight portal</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3 py-2 small shadow-sm"><i class="bi bi-exclamation-triangle me-1"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Admin Username</label>
                <input type="text" name="username" class="form-control glass-input rounded-3" placeholder="Admin Username" required>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Admin Password</label>
                <input type="password" name="password" class="form-control glass-input rounded-3" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                Authenticate <i class="bi bi-shield-check ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <a href="/" class="small text-secondary text-decoration-none"><i class="bi bi-house me-1"></i>Back to Home</a>
        </div>
    </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
