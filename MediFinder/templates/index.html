<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFinder - Modern Pharmacy & Medicine Locator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="ambient-bg">

<nav class="navbar navbar-expand-lg glass-nav sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary" href="/"><i class="bi bi-capsule-pill me-2"></i>MedFinder</a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm glass-card px-3 rounded-pill" onclick="toggleTheme()" title="Toggle Theme">
                <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-dark"></i>
            </button>
            <a href="/login" class="btn btn-outline-primary btn-sm px-3 rounded-pill"><i class="bi bi-shop me-1"></i> Pharmacy Portal</a>
            <a href="/admin" class="btn btn-primary text-white btn-sm px-3 rounded-pill fw-semibold"><i class="bi bi-shield-lock me-1"></i> Admin</a>
        </div>
    </div>
</nav>

<div class="hero-wrapper text-center text-white mb-4">
    <div class="container position-relative" style="z-index: 2;">
        <h1 class="display-5 fw-bold mb-2">Find Local Medicine Inventory Real-Time</h1>
        <p class="lead opacity-90 mb-4">Search by medicine brand name or generic salt composition with live store availability.</p>
        
        <div class="card p-3 glass-card mx-auto text-dark" style="max-width: 850px; border-radius: 20px;">
            <form id="search-form" class="row g-2">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text border-end-0 rounded-start-pill"><i class="bi bi-search text-primary"></i></span>
                        <input type="text" id="query-input" class="form-control glass-input border-start-0 rounded-end-pill ps-0" placeholder="Brand or Salt (e.g., Paracetamol)" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text border-end-0 rounded-start-pill"><i class="bi bi-geo-alt text-danger"></i></span>
                        <input type="text" id="city-input" class="form-control glass-input border-start-0 ps-0" placeholder="City / Area">
                        <button type="button" class="btn btn-outline-secondary glass-input rounded-end-pill px-3" onclick="detectUserLocation()" title="Auto-detect my location">
                            <i class="bi bi-crosshair text-primary"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold shadow-sm"><i class="bi bi-compass me-1"></i> Search Nearby</button>
                </div>
            </form>
        </div>
    </div>

    <div class="hero-waves">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path class="shape-fill wave-path-2" d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z"></path>
            <path class="shape-fill wave-path-1" d="M0,0 C300,90 600,-40 800,50 C1000,120 1100,20 1200,40 L1200,120 L0,120 Z"></path>
        </svg>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 h-100 glass-card">
                <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-list-stars me-2"></i>Search Results</h5>
                    <span id="results-count" class="badge bg-primary rounded-pill px-3 py-2">0 found</span>
                </div>
                <div class="card-body px-4">
                    <div id="results-container" class="list-group list-group-flush overflow-auto" style="max-height: 550px;">
                        <div class="text-center py-5 text-muted">
                            <i class="bi bi-search fs-1 text-primary opacity-50"></i>
                            <p class="mt-2">Enter a medicine brand or salt composition above to perform a live search.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 glass-card">
                <div id="map" style="height: 600px; width: 100%;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
